name: Build H-VENDOR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H-Vendor tree
        uses: actions/checkout@v4

      - name: Sanity checks
        run: |
          set -e
          test -x device/a2corelte/vendor/bin/vndservicemanager
          test -f META-INF/com/google/android/updater-script
          ls -l device/a2corelte/vendor/bin/vndservicemanager

      - name: Package H-VENDOR flashable zip
        run: |
          set -e
          mkdir -p out
          VER="v1_4-$(date +%Y%m%d)"
          zip -r -y "out/H-VENDOR-A2CORELTE-${VER}.zip" . \
            -x ".git/*" -x ".github/*" -x "out/*"
          ls -lh out/

      - name: Upload H-VENDOR artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-VENDOR-A2CORELTE
          path: out/*.zip
          if-no-files-found: error
