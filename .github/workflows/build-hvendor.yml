name: Build H-VENDOR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04.04
    steps:
      - name: Checkout H-Vendor tree
        uses: actions/checkout@v4

      - name: Checkout vndsm-builder
        uses: actions/checkout@v4
        with:
          repository: Faisalahame/vndsm-builder
          path: vndsm-builder
          fetch-depth: 1

      - name: Build vndservicemanager (ARM32, static)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd vndsm-builder
          "$BIN/armv7a-linux-androideabi21-clang" -Os -Wall -Wextra -static -fno-pie -no-pie -Wl,--gc-sections vndsm.c -o vndservicemanager
          "$BIN/llvm-strip" vndservicemanager
          file vndservicemanager
          readelf -h vndservicemanager | grep -E "Class|Machine"
          if readelf -d vndservicemanager 2>/dev/null | grep -q NEEDED; then
            echo "ERROR: binary is not fully static"; exit 1
          fi

      - name: Inject fresh vndservicemanager into vendor tree
        run: |
          set -e
          # Replaces the stock vndsm with our freshly compiled static ARM32 one
          install -D -m 0755 vndsm-builder/vndservicemanager device/a2corelte/vendor/bin/vndservicemanager

      - name: Package H-VENDOR flashable zip
        run: |
          set -e
          mkdir -p out
          VER="v1_3-$(date +%Y%m%d)"
          zip -r -y "out/H-VENDOR-A2CORELTE-${VER}.zip" . \
            -x ".git/*" -x ".github/*" -x "out/*" -x "vndsm-builder/*"
          ls -lh out/

      - name: Upload H-VENDOR artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-VENDOR-A2CORELTE
          path: out/*.zip
          if-no-files-found: error
